name: ci

# Continuous verification on every push and PR. The release workflow only runs on tags, so
# without this nothing checks `main` between releases and a break is found at publish time.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build FIRST. Packages consume each other's built output (the example app imports
      # @aunboard/vite in its config), so typechecking a fresh checkout before building
      # fails on missing dist. Build errors surface here too — tsup emits types, so a type
      # error fails the build step.
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test
