name: release

# Cut a release by pushing a v* tag (see RELEASING.md). Builds + tests, then publishes every
# public package to npm with provenance and attaches the tarballs to a GitHub Release.
#
# IMPORTANT: publishing uses `pnpm publish`, not `npm publish`. @aunboard/vite and
# @aunboard/next depend on @aunboard/plugin-core via `workspace:*`; pnpm rewrites that to a real
# version range at pack time, npm does not — publishing with npm would ship a manifest no
# consumer can install. Packages are published in dependency order for the same reason.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # uses the packageManager pin from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Build FIRST. Packages consume each other's built output (the example app imports
      # @aunboard/vite in its config), so typechecking a fresh checkout before building
      # fails on missing dist. Build errors surface here too — tsup emits types, so a type
      # error fails the build step.
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test

      # Fail loudly and legibly if the token is wrong, rather than surfacing as a bare 403
      # on the first publish. Prints WHICH npm account the token maps to and whether that
      # account can see the aunboard org.
      - name: Check npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "authenticated as: $(npm whoami || echo '<whoami failed — token invalid or read-only>')"
          echo "orgs visible to this token:"
          npm org ls aunboard 2>&1 | head -20 || echo "<cannot read the aunboard org with this token>"

      # Dependency order: plugin-core is depended on by the bundler adapters.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          for pkg in aunboard plugin-core cli vite next; do
            dir="packages/$pkg"
            [ -f "$dir/package.json" ] || { echo "skip $pkg (not present)"; continue; }
            echo "::group::publish $pkg"
            pnpm --filter "./$dir" publish --access public --no-git-checks
            echo "::endgroup::"
          done

      - name: Pack tarballs (release artifacts)
        run: |
          set -euo pipefail
          mkdir -p dist-tarballs
          for pkg in aunboard plugin-core cli vite next; do
            dir="packages/$pkg"
            [ -f "$dir/package.json" ] || continue
            (cd "$dir" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist-tarballs")
          done
          ls -la dist-tarballs

      - name: Attach tarballs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-tarballs/*.tgz
          generate_release_notes: true
          fail_on_unmatched_files: true
