name: release

# Cut a release by pushing a v* tag (see RELEASING.md). Builds + tests, then publishes every
# public package to npm with provenance and attaches the tarballs to a GitHub Release.
#
# AUTHENTICATION: trusted publishing (OIDC). There is no npm token. GitHub mints a short-lived
# identity for this workflow and npm trusts it because each package names this repo + workflow
# as a trusted publisher. Nothing long-lived exists to leak, and no 2FA prompt blocks CI.
#
# This requires each package to ALREADY EXIST on npm — npm will not let you configure a trusted
# publisher for a package it has never seen. The first publish was therefore done by hand; see
# scripts/first-publish.sh. A brand-new package added later needs that same bootstrap.
#
# IMPORTANT: publishing uses `pnpm publish`, not `npm publish`. @aunboard/vite and
# @aunboard/next depend on @aunboard/plugin-core via `workspace:*`; pnpm rewrites that to a real
# version range at pack time, npm does not — publishing with npm would ship a manifest no
# consumer can install. Packages are published in dependency order for the same reason.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6 # uses the packageManager pin from package.json

      # v6+ is required for trusted publishing support.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Build FIRST. Packages consume each other's built output (the example app imports
      # @aunboard/vite in its config), so typechecking a fresh checkout before building
      # fails on missing dist. Build errors surface here too — tsup emits types, so a type
      # error fails the build step.
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test

      # Dependency order: plugin-core is depended on by the bundler adapters.
      # No NODE_AUTH_TOKEN — pnpm exchanges the workflow's OIDC identity for a short-lived
      # npm credential. If this 404s on a package, that package has no trusted publisher
      # configured on npm yet.
      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          for pkg in aunboard plugin-core cli vite next; do
            dir="packages/$pkg"
            [ -f "$dir/package.json" ] || { echo "skip $pkg (not present)"; continue; }
            echo "::group::publish $pkg"
            pnpm --filter "./$dir" publish --access public --no-git-checks
            echo "::endgroup::"
          done

      - name: Pack tarballs (release artifacts)
        run: |
          set -euo pipefail
          mkdir -p dist-tarballs
          for pkg in aunboard plugin-core cli vite next; do
            dir="packages/$pkg"
            [ -f "$dir/package.json" ] || continue
            (cd "$dir" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist-tarballs")
          done
          ls -la dist-tarballs

      - name: Attach tarballs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-tarballs/*.tgz
          generate_release_notes: true
          fail_on_unmatched_files: true
